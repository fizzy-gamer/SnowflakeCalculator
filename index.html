<!DOCTYPE html>
<html>
  <head>
    <title>Snowflake Calculator</title>
    <link rel="stylesheet" href="./src/style.css" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/x-icon" href="Snowflake.png" />
    <meta property="og:title" content="Snowflake Calculator" />
    <meta
      property="og:description"
      content="Snowflake calculator app for Industrialist Christmas Event 2025."
    />
    <meta property="og:site_name" content="GitHub Pages" />
    <meta
      property="og:image"
      content="https://fizzy-gamer.github.io/SnowflakeCalculator/Snowflake.png"
    />
    <link
      href="https://fonts.googleapis.com/css?family=Fredoka One"
      rel="stylesheet"
    />
    <script type="module" src="./src/script.js"></script>
  </head>
  
  <div class="Main">
    <h1>❄️ Snowflake Calculator</h1>
  </div>

  <div class="Rates">
    <h2><u>❄️  Rates  ❄️</u></h2>
    <div id="AverageRP">Average RP Value: 0 RP</div>
    <div id="SnowflakesPerLaunch">Snowflakes Per Launch: ❄️0</div>
    <div id="SnowflakesPerHour">Snowflakes Per Hour: ❄️0</div>
    <div id="RateOfItems">u/s of each item: 0 u/s</div>
  </div>

  <div class="Settings">
    <h2>Select Items</h2>
    <div class="OptionButtons">
      <button  class="DeselectAllButton" id="DeselectAllButton">Deselect</button>
      <p id="AmountSelected">0 Selected</p>
      <button class="SelectAllButton" id="SelectAllButton">Select All</button>
    </div>
    <div class="ItemButtons" id="ItemButtons"></div>
  </div>
  </body>
  
  <p class="disclaimer">
    <a href="https://github.com/fizzy-gamer/SnowflakeCalculator">Source Code</a>
    • Calculator made by <a href="https://github.com/fizzy-gamer">fizzygamer</a>
  </p>
</html>
